[package]
name = "salary-counter-desktop"
version = "3.1.5"
description = "下班工资计数器桌面小组件"
authors = ["Fuquan"]
edition = "2021"
build = "build.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde_json = "1"
