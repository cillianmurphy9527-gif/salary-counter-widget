name: Salary Counter — lightweight desktop widget
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Unpack first-run widget source and compatibility fix
        run: |
          if [ -f widget-patch.tar.xz ]; then tar -xJf widget-patch.tar.xz -C .; fi
          if [ -f widget-patch-fix.tar.xz ]; then tar -xJf widget-patch-fix.tar.xz -C .; fi
          rm -f widget-patch.tar.xz widget-patch-fix.tar.xz main.js preload.js .github/workflows/build-installers.yml
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Build assets and test UI/calculations
        run: |
          npm install --no-audit --no-fund
          npm run build:assets
          npm run test:syntax
          node scripts/test-html.js
          python -m pip install --upgrade pip playwright
          python -m playwright install --with-deps chromium
          python scripts/test-ui.py
      - name: Archive complete project
        run: |
          git add -A
          python scripts/archive-project.py
      - uses: actions/upload-artifact@v4
        with:
          name: SalaryCounter-3.1.5-Complete-Project
          path: |
            release/SalaryCounter-3.1.5-Complete-Project.zip
            release/SHA256SUMS-Project.txt
          if-no-files-found: error
          retention-days: 30
  windows:
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { name: SalaryCounter-3.1.5-Complete-Project, path: . }
      - name: Extract project
        shell: pwsh
        run: Expand-Archive -Path 'SalaryCounter-3.1.5-Complete-Project.zip' -DestinationPath . -Force
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: SalaryCounter-3.1.5/src-tauri -> target
          shared-key: salary-widget-native
      - name: Test Tauri backend
        working-directory: SalaryCounter-3.1.5
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Build Windows installer
        working-directory: SalaryCounter-3.1.5
        run: |
          npm install --no-audit --no-fund
          npm run build:assets
          npm run tauri:build -- --bundles nsis
      - name: Verify installer size
        shell: pwsh
        working-directory: SalaryCounter-3.1.5
        run: |
          $f = Get-ChildItem 'src-tauri/target/release/bundle/nsis' -Filter '*.exe' -File | Select-Object -First 1
          if (!$f) { throw 'Windows installer missing' }
          $mb = [math]::Round($f.Length / 1MB, 2)
          if ($mb -gt 60) { throw "Installer unexpectedly large: $mb MB" }
          Get-FileHash $f.FullName -Algorithm SHA256 | ForEach-Object { "$($_.Hash)  $($f.Name)" } | Set-Content 'SHA256SUMS-Windows.txt'
      - uses: actions/upload-artifact@v4
        with:
          name: SalaryCounter-3.1.5-Windows-x64
          path: |
            SalaryCounter-3.1.5/src-tauri/target/release/bundle/nsis/*.exe
            SalaryCounter-3.1.5/SHA256SUMS-Windows.txt
          if-no-files-found: error
          retention-days: 30
  macos:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: ARM64
            target: aarch64-apple-darwin
            runner: macos-15
          - arch: Intel
            target: x86_64-apple-darwin
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/download-artifact@v4
        with: { name: SalaryCounter-3.1.5-Complete-Project, path: . }
      - name: Extract project
        run: unzip -q SalaryCounter-3.1.5-Complete-Project.zip
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: SalaryCounter-3.1.5/src-tauri -> target
          shared-key: salary-widget-native-${{ matrix.arch }}
      - name: Build macOS DMG
        working-directory: SalaryCounter-3.1.5
        run: |
          npm install --no-audit --no-fund
          npm run build:assets
          npm run tauri:build -- --target ${{ matrix.target }} --bundles dmg
      - name: Verify DMG and export APP bundle
        working-directory: SalaryCounter-3.1.5
        shell: bash
        run: |
          set -euo pipefail
          DMG=$(find src-tauri/target/${{ matrix.target }}/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)
          test -n "$DMG"
          hdiutil verify "$DMG"
          MOUNT=$(mktemp -d)
          hdiutil attach "$DMG" -mountpoint "$MOUNT" -nobrowse -readonly -quiet
          APP=$(find "$MOUNT" -maxdepth 2 -name '*.app' -print -quit)
          test -n "$APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "SalaryCounter-3.1.5-mac-${{ matrix.arch }}.zip"
          hdiutil detach "$MOUNT" -quiet
          shasum -a 256 "$DMG" "SalaryCounter-3.1.5-mac-${{ matrix.arch }}.zip" > "SHA256SUMS-macOS-${{ matrix.arch }}.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: SalaryCounter-3.1.5-macOS-${{ matrix.arch }}
          path: |
            SalaryCounter-3.1.5/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            SalaryCounter-3.1.5/SalaryCounter-3.1.5-mac-${{ matrix.arch }}.zip
            SalaryCounter-3.1.5/SHA256SUMS-macOS-${{ matrix.arch }}.txt
          if-no-files-found: error
          retention-days: 30
